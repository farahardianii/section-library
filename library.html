<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Section Library — Browse & Discover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #fafafa;
            --text: #16161a;
            --muted: #55555d;
            --panel: #ffffff;
            --border: #e0e0e0;
            --accent: #9e451f;
            --accent-dark: #7b351a;
            --chip-bg: #f5f5f0;
            --chip-selected: #9e451f;
            --chip-selected-fg: #ffffff;
            --gutter: clamp(24px, 4vw, 64px);
            --radius: 12px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; }

        html { font-size: 16px; }

        body {
            font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        a { color: inherit; text-decoration: none; }

        /* ===== Page Shell ===== */
        .page-shell { max-width: 1200px; margin: 0 auto; padding: var(--gutter); }

        /* ===== Header / Page Title ===== */
        .page-header {
            margin-bottom: 48px;
        }

        .page-header h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(32px, 4vw, 40px);
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
        }

        .page-header p {
            color: var(--muted);
            font-size: 16px;
            max-width: 600px;
        }

        /* ===== Filters ===== */
        .filters {
            margin: 32px 0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            background: var(--chip-bg);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .filter-chip:hover { border-color: var(--accent); background: var(--accent-dark); color: var(--chip-selected-fg); }

        .filter-chip.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--chip-selected-fg);
        }

        .filter-chip .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }

        /* ===== Sort ===== */
        .sort-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            font-size: 13px;
            color: var(--muted);
        }

        .sort-control select {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--panel);
            font-family: inherit;
            cursor: pointer;
        }

        /* ===== Section Grid ===== */
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* ===== Section Card ===== */
        .section-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }

        .section-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px -8px rgba(22, 22, 26, 0.15);
        }

        .section-card .thumb {
            height: 180px;
            background: #f5f5f5;
            position: relative;
            overflow: hidden;
        }

        .section-card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .section-card .info {
            padding: 20px 24px;
        }

        .section-card .category {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: inline-block;
        }

        .section-card .name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .section-card .desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .section-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-card .view-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--accent);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .section-card .view-btn svg {
            width: 10px;
            height: 10px;
            transition: transform 0.2s ease;
        }

        .section-card:hover .view-btn svg {
            transform: translateX(2px);
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
            color: var(--muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            fill: currentColor;
        }

        /* ===== Reduced motion ===== */
        @media (prefers-reduced-motion: reduce) {
            .section-card:hover { transform: none; box-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- ===== Header ===== -->
    <header class="page-header">
        <h1>Library</h1>
        <p>A curated collection of reusable HTML/CSS/JS sections. Browse, preview, and copy sections for your projects.</p>
    </header>

    <!-- ===== Filters ===== -->
    <div class="filters" id="filters">
        <!-- Category chips will be injected by JS -->
    </div>

    <!-- ===== Sort Control ===== -->
    <div class="sort-control">
        <label for="sortBy">Sort by</label>
        <select id="sortBy" aria-label="Sort sections by">
            <option value="all">All</option>
            <option value="latest">Latest</option>
            <option value="popular">Popular</option>
        </select>
    </div>

    <!-- ===== Section Grid ===== -->
    <main class="page-shell">
        <section class="section-grid" id="sectionGrid">
            <!-- Cards will be injected by JS -->
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <h3>No sections found</h3>
                <p>Try adjusting your filters or search.</p>
            </div>
        </section>
    </main>

    <script>
        // Section data
        import { sections, categories } from './sections-data.js';

        // DOM refs
        const grid = document.getElementById('sectionGrid');
        const filtersContainer = document.getElementById('filters');
        const sortSelect = document.getElementById('sortBy');

        // Build category filter chips
        function buildFilterChips() {
            // Always include "All" first
            const allChip = `
                <button class="filter-chip selected" data-category="all" role="menuitemcheckbox" aria-checked="true">
                    <span class="tag">All</span>
                </button>`;
            filtersContainer.innerHTML = allChip;

            // Build chips for each category
            const categorySet = [...new Set(sections.map(s => s.category))];
            categorySet.forEach(key => {
                const cat = categories.find(c => c.key === key);
                if (!cat) return;

                const chipSections = sections.filter(s => s.category === key).length;
                const chip = `
                    <button class="filter-chip" data-category="${key}" role="menuitemcheckbox" aria-checked="false">
                        <span class="tag">${cat.name}</span>
                        <span>${chipSections}</span>
                    </button>`;
                filtersContainer.insertAdjacentHTML('beforeend', chip);
            });

            // Re-attach click handlers
            attachFilterHandlers();
        }

        // Attach filter chip click handlers
        function attachFilterHandlers() {
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    // Toggle selected state
                    this.classList.toggle('selected', !this.classList.contains('selected'));
                    document.querySelectorAll('.filter-chip').forEach(c => {
                        if (c !== this) c.classList.remove('selected');
                    });

                    // Filter sections
                    const category = this.dataset.category;
                    filterSections(category);
                });
            });
        }

        // Filter sections by category
        function filterSections(category) {
            renderSections(category, sortSelect.value);
        }

        // Render sections
        function renderSections(category = 'all', sort = 'all') {
            let filtered = sections;

            if (category !== 'all') {
                filtered = sections.filter(s => s.category === category);
            }

            // Sort
            if (sort === 'latest') {
                // Sort by id (assuming higher id = later)
                filtered.sort((a, b) => b.id.localeCompare(a.id));
            } else if (sort === 'popular') {
                // Sort by number of sections in category (desc)
                filtered.sort((a, b) => {
                    const aCount = sections.filter(s => s.category === a.category).length;
                    const bCount = sections.filter(s => s.category === b.category).length;
                    return bCount - aCount;
                });
            }
            // 'all' keeps original order

            // Render grid
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <h3>No sections found</h3>
                        <p>Try adjusting your filters or search.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(s => `
                <article class="section-card" data-category="${s.category}" data-key="${s.key}">
                    <div class="thumb" style="background: #f5f5f5;">
                        <img src="${s.preview}" alt="${s.name}" loading="lazy" />
                    </div>
                    <div class="info">
                        <span class="category">${s.category === 'hero' ? 'Hero' : s.category}</span>
                        <h3 class="name">${s.name}</h3>
                        <p class="desc">${s.description}</p>
                        <div class="meta">
                            <a class="view-btn" href="${s.link}" target="_blank">
                                View Section
                                <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
                                    <path d="M9 2l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </article>`).join('');

            // Attach click handlers for view buttons (open in new tab)
            // The view-btn already has target="_blank" in the HTML
        }

        // Initial render
        buildFilterChips();
        renderSections('all', 'all');

        // Sort change
        sortSelect.addEventListener('change', function() {
            const selectedCat = document.querySelector('.filter-chip.selected');
            const category = selectedCat ? selectedCat.dataset.category : 'all';
            renderSections(category, this.value);
        });

        // Chip selection state management
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
            });
        });
    </script>

</body>
</html>
