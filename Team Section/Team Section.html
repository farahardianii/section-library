<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Faces Behind Our Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1113;
    --surface:#16191e;
    --text:#f2f0e9;
    --dim:#8b8f98;
    --line:rgba(255,255,255,.14);
    --accent:#d6ff4b;
    --accent-ink:#111408;
    --hot:#ff6a3d;
    --card-w:330px;
    --card-h:420px;
    --gap:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:#2a2e35 var(--bg)}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
    font-family:"Space Grotesk",-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}

  .wrap{padding:44px 0 80px}

  /* ---------- header ---------- */
  .head{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:28px;padding:0 40px;margin-bottom:54px;
  }
  .title .kicker{
    font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--accent);margin-bottom:16px;display:block;
  }
  h1{
    font-family:"Bricolage Grotesque","Arial Black",sans-serif;
    font-weight:800;text-transform:uppercase;
    font-size:clamp(34px,5.6vw,72px);line-height:.92;letter-spacing:-.035em;
    max-width:14ch;
  }
  h1 em{font-style:normal;color:var(--accent)}

  .nav{display:flex;align-items:center;gap:12px;flex-shrink:0;padding-bottom:6px}
  .count{
    font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.06em;
    color:var(--dim);font-variant-numeric:tabular-nums;
  }
  .count b{color:var(--text);font-weight:500}
  .arrow{
    width:56px;height:56px;border-radius:50%;background:transparent;
    border:1.4px solid var(--line);display:grid;place-items:center;cursor:pointer;
    transition:.2s ease;color:var(--text);
  }
  .arrow:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}
  .arrow:active:not(:disabled){transform:translateY(0) scale(.96)}
  .arrow:disabled{opacity:.3;cursor:default}
  .arrow svg{width:22px;height:14px}

  /* ---------- layout ---------- */
  .main{display:flex;gap:52px;align-items:flex-start;padding:0 40px}

  /* ---------- filters ---------- */
  .filters{
    display:flex;flex-direction:column;gap:8px;flex:0 0 176px;
    position:sticky;top:32px;
  }
  .filters .lbl{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--dim);margin-bottom:8px;
  }
  .chip{
    appearance:none;border:1.3px solid var(--line);background:transparent;
    color:var(--text);font:inherit;font-size:14px;text-align:left;
    padding:11px 14px;border-radius:3px;cursor:pointer;
    display:flex;align-items:center;gap:10px;transition:.18s ease;
  }
  .chip .n{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim);
    min-width:18px;transition:.18s ease;
  }
  .chip:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.04)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
  .chip.on .n{color:rgba(17,20,8,.55)}
  .chip .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim)}
  .chip.on .cnt{color:rgba(17,20,8,.55)}

  /* ---------- rail ---------- */
  .railZone{flex:1 1 auto;min-width:0}
  .rail{
    display:flex;gap:var(--gap);overflow-x:auto;scroll-behavior:smooth;
    padding:4px 40px 26px 0;scroll-snap-type:x mandatory;align-items:flex-start;
    scrollbar-width:none;-ms-overflow-style:none;cursor:grab;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail.dragging{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none}
  .rail.dragging .card{pointer-events:none}

  .card{flex:0 0 var(--card-w);scroll-snap-align:start}
  .card:nth-child(even){margin-top:54px}
  .photo{
    width:100%;height:var(--card-h);border-radius:4px;overflow:hidden;
    position:relative;background:#1b1e24;
  }
  .photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(8,9,11,.55),transparent 45%);
    opacity:0;transition:.3s ease;
  }
  .photo .ph{position:absolute;inset:0}
  .photo img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:center 20%;display:block;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);
  }
  .photo img.bad{display:none}
  .photo svg{width:100%;height:100%;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .card:hover .photo svg,.card:hover .photo img{transform:scale(1.045)}
  .card:hover .photo::after{opacity:1}
  .idx{
    position:absolute;top:12px;left:12px;z-index:2;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
    color:rgba(255,255,255,.85);background:rgba(10,11,13,.55);
    padding:4px 8px;border-radius:2px;backdrop-filter:blur(6px);
  }
  .roleTag{
    position:absolute;left:12px;bottom:12px;z-index:2;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);
    transform:translateY(14px);opacity:0;transition:.3s ease .05s;
  }
  .card:hover .roleTag{transform:translateY(0);opacity:1}

  .card h3{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
    font-size:19px;letter-spacing:-.02em;margin:16px 0 6px;
  }
  .meta{
    display:flex;align-items:center;gap:8px;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
  }
  .meta::before{content:"";width:14px;height:1.5px;background:var(--hot);flex:0 0 auto}
  .empty{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--dim);padding:48px 0}

  /* ---------- progress ---------- */
  .progress{
    height:2px;background:rgba(255,255,255,.1);margin:14px 40px 0 0;
    position:relative;overflow:hidden;border-radius:2px;
  }
  .progress i{
    position:absolute;inset:0 auto 0 0;width:20%;background:var(--accent);
    transition:width .25s ease,transform .25s ease;border-radius:2px;
  }
  .hint{
    display:flex;justify-content:space-between;gap:16px;margin-top:14px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dim);
  }
  .hint kbd{
    font-family:inherit;border:1px solid var(--line);border-radius:3px;
    padding:2px 6px;color:var(--text);
  }

  @media (max-width:900px){
    .head{flex-direction:column;align-items:flex-start;padding:0 20px;margin-bottom:34px}
    .main{flex-direction:column;padding:0 20px;gap:26px}
    .filters{position:static;flex-direction:row;flex-wrap:wrap;width:100%}
    .filters .lbl{width:100%}
    .chip .cnt{display:none}
    :root{--card-w:255px;--card-h:330px}
    .card:nth-child(even){margin-top:0}
    .hint{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="title">
      <span class="kicker">Our People — 2026</span>
      <h1>The Faces Behind <em>Our Mission</em></h1>
    </div>
    <div class="nav">
      <button class="arrow" id="prev" aria-label="Previous">
        <svg viewBox="0 0 30 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M29 8H1.5M8 1.5 1.5 8 8 14.5"/></svg>
      </button>
      <span class="count" id="count"><b>01</b> / 08</span>
      <button class="arrow" id="next" aria-label="Next">
        <svg viewBox="0 0 30 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8h27.5M22 1.5 28.5 8 22 14.5"/></svg>
      </button>
    </div>
  </div>

  <div class="main">
    <div class="filters" id="filters"><span class="lbl">Filter / dept</span></div>
    <div class="railZone">
      <div class="rail" id="rail"></div>
      <div class="progress"><i id="bar"></i></div>
      <div class="hint">
        <span>Drag / <kbd>←</kbd> <kbd>→</kbd> to explore</span>
        <span id="shown">8 profiles</span>
      </div>
    </div>
  </div>

</div>

<script>
const CATS = ["All","CEO","Leadership","Operations","Animal Care","Laboratory","Support Functions"];

const PEOPLE = [
  ["Ms. Emily Hartley","Communications Lead","Support Functions","team/01.jpg"],
  ["Mr. Daniel Moretti","Chief Executive Officer","CEO","team/02.jpg"],
  ["Ms. Naomi Carter","Head of Rescue Programs","Leadership","team/03.jpg"],
  ["Ms. Priya Raghavan","Laboratory Director","Laboratory","team/04.jpg"],
  ["Mr. Arjun Mehta","Volunteer Coordinator","Support Functions","team/05.jpg"],
  ["Ms. Chloe Bennett","Facilities & Operations Manager","Operations","team/06.jpg"],
  ["Ms. Sofia Ramirez","Head of Animal Care","Animal Care","team/07.jpg"],
  ["Mr. Richard Ashford","Chief Veterinarian","Animal Care","team/08.jpg"]
];

/* ---------- portrait generator ---------- */
const SKIN  = ["#e8b18a","#c98d63","#a96f45","#8d5a37","#f0c39c","#b87b50","#d69b70","#7a4c2f"];
const HAIR  = ["#1b1613","#2e231b","#4a3a2c","#7b6a58","#b9b4ac","#171412","#5a4634","#8f857a"];
const BG    = ["#243b6b","#5c2b33","#1f4a42","#3a2a55","#4d3a1e","#123a52","#4a2036","#2c4a22"];
const SHIRT = ["#e9e5da","#39424e","#c7c1b0","#7f8a97","#20262e","#d8cfc0","#5b6572","#96a08c","#efe7d6","#37413a"];

function portrait(i, mic){
  const skin=SKIN[i%SKIN.length], hair=HAIR[(i*3+1)%HAIR.length],
        shirt=SHIRT[(i*5+2)%SHIRT.length], bg=BG[(i*7)%BG.length];
  const glasses=i%4===1, facial=i%3!==2, arms=i%2===0;
  const hairPath=[
    "M132 150c4-46 30-74 68-74s64 28 68 74c-6-24-24-36-44-40-22-4-46 0-64 14-14 11-22 16-28 26z",
    "M130 158c2-52 32-82 70-82s68 30 70 82c-8-30-20-44-46-50-30-7-62 4-78 26-8 11-12 16-16 24z",
    "M136 142c6-40 32-64 64-64s58 24 64 64c-8-20-22-30-42-34-26-5-52 2-66 18-8 9-14 10-20 16z"
  ][i%3];

  return `
<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="400" height="500" fill="${bg}"/>
  <circle cx="${i%2?330:70}" cy="${i%3?90:410}" r="150" fill="rgba(255,255,255,.06)"/>
  <path d="M0 500 L400 340 L400 500 Z" fill="rgba(0,0,0,.16)"/>
  <path d="M60 500V406c0-58 44-96 100-110l40-10 40 10c56 14 100 52 100 110v94z" fill="${shirt}"/>
  <path d="M160 286l40 44 40-44-16-8-24 26-24-26z" fill="${skin}" opacity=".92"/>
  <path d="M160 286l40 44 40-44" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="3"/>
  <path d="M174 236h52v54c0 14-52 14-52 0z" fill="${skin}"/>
  <path d="M174 240c14 16 38 16 52 0v18c-14 14-38 14-52 0z" fill="rgba(0,0,0,.2)"/>
  ${arms&&!mic?`
  <path d="M64 400c-6 46 24 78 74 84l60-52c-30-6-46-24-50-46z" fill="${shirt}"/>
  <path d="M336 400c6 46-24 78-74 84l-60-52c30-6 46-24 50-46z" fill="${shirt}"/>
  <path d="M170 402c14-10 46-10 60 0-8 16-52 16-60 0z" fill="${skin}"/>`:``}
  <ellipse cx="200" cy="176" rx="66" ry="76" fill="${skin}"/>
  <ellipse cx="134" cy="182" rx="10" ry="15" fill="${skin}"/>
  <ellipse cx="266" cy="182" rx="10" ry="15" fill="${skin}"/>
  <path d="${hairPath}" fill="${hair}"/>
  <path d="M166 160q14-9 28-1M206 159q14-8 28 1" stroke="${hair}" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="180" cy="177" rx="7" ry="6.5" fill="#241c15"/>
  <ellipse cx="220" cy="177" rx="7" ry="6.5" fill="#241c15"/>
  <path d="M200 184v18c0 6-5 9-10 9" stroke="rgba(0,0,0,.3)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M184 226q16 12 32 0" stroke="rgba(70,30,20,.65)" stroke-width="5" fill="none" stroke-linecap="round"/>
  ${facial?`<path d="M142 186c2 44 26 76 58 76s56-32 58-76c-4 34-26 54-58 54s-54-20-58-54z" fill="${hair}" opacity=".92"/>
  <path d="M172 216q28 16 56 0-6 20-28 20t-28-20z" fill="${hair}" opacity=".9"/>`:``}
  ${glasses?`<g stroke="#22252b" stroke-width="4" fill="none">
    <rect x="158" y="162" width="42" height="32" rx="8"/>
    <rect x="200" y="162" width="42" height="32" rx="8"/>
    <path d="M148 170l10 4M252 170l-10 4"/></g>`:``}
  ${mic?`
  <path d="M70 500v-84c0-40 30-66 68-74l30 66c-24 8-36 24-38 46v46z" fill="${shirt}"/>
  <rect x="150" y="250" width="18" height="120" rx="9" transform="rotate(8 159 310)" fill="#22252b"/>
  <ellipse cx="164" cy="246" rx="20" ry="24" fill="#31353d"/>
  <ellipse cx="164" cy="246" rx="12" ry="15" fill="#4d525c"/>
  <path d="M132 356c8-16 34-20 46-8 10 10 6 30-8 36-16 7-40 0-46-14-4-8 0-10 8-14z" fill="${skin}"/>`:``}
  <path d="M118 366h44v52h-44zM238 366h44v52h-44z" fill="rgba(0,0,0,.08)"/>
  <path d="M118 366h44M238 366h44" stroke="rgba(0,0,0,.2)" stroke-width="3"/>
</svg>`;
}

/* ---------- state / dom ---------- */
let active="All";
const rail=document.getElementById("rail"),
      filters=document.getElementById("filters"),
      prevBtn=document.getElementById("prev"),
      nextBtn=document.getElementById("next"),
      countEl=document.getElementById("count"),
      bar=document.getElementById("bar"),
      shown=document.getElementById("shown");

const countOf=c=>PEOPLE.filter(p=>c==="All"||p[2]===c).length;

CATS.forEach((c,idx)=>{
  const b=document.createElement("button");
  b.className="chip"+(idx===0?" on":"");
  b.dataset.cat=c;
  b.innerHTML=`<span class="n">${String(idx+1).padStart(2,"0")}</span>${c}<span class="cnt">${countOf(c)}</span>`;
  b.onclick=()=>{
    active=c;
    [...filters.querySelectorAll(".chip")].forEach(x=>x.classList.toggle("on",x.dataset.cat===c));
    render();
  };
  filters.appendChild(b);
});

function render(){
  const list=PEOPLE.map((p,i)=>({name:p[0],role:p[1],cat:p[2],photo:p[3],i}))
    .filter(p=>active==="All"||p.cat===active);

  rail.innerHTML=list.length?list.map((p,n)=>`
    <article class="card">
      <div class="photo">
        <span class="idx">${String(n+1).padStart(3,"0")}</span>
        <div class="ph">${portrait(p.i,p.i===0)}</div>
        <img src="${p.photo}" alt="${p.name}" loading="lazy" onerror="this.classList.add('bad')">
        <span class="roleTag">${p.cat}</span>
      </div>
      <h3>${p.name}</h3>
      <div class="meta">${p.role}</div>
    </article>`).join(""):`<p class="empty">// no profiles in this department</p>`;

  rail.scrollLeft=0;
  shown.textContent=`${list.length} profiles`;
  update();
}

function update(){
  const max=rail.scrollWidth-rail.clientWidth;
  const pos=max>0?rail.scrollLeft/max:0;
  const page=Math.min(PEOPLE.length,Math.round(rail.scrollLeft/(rail.clientWidth||1))+1);
  countEl.innerHTML=`<b>${String(page).padStart(2,"0")}</b> / ${PEOPLE.length}`;
  bar.style.width=Math.max(8,pos*100)+"%";
  bar.style.transform=`translateX(${pos*0}%)`;
  prevBtn.disabled=rail.scrollLeft<=2;
  nextBtn.disabled=rail.scrollLeft>=max-2;
}

function step(dir){
  const card=rail.querySelector(".card");
  const w=card?card.getBoundingClientRect().width+16:rail.clientWidth*.8;
  const per=Math.max(1,Math.floor(rail.clientWidth/w));
  rail.scrollBy({left:dir*w*per,behavior:"smooth"});
}

prevBtn.onclick=()=>step(-1);
nextBtn.onclick=()=>step(1);
rail.addEventListener("scroll",()=>requestAnimationFrame(update));
window.addEventListener("resize",update);

/* keyboard */
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){step(1);e.preventDefault()}
  if(e.key==="ArrowLeft"){step(-1);e.preventDefault()}
});

/* drag to scroll */
let down=false,startX=0,startL=0,moved=0;
rail.addEventListener("pointerdown",e=>{
  down=true;moved=0;startX=e.clientX;startL=rail.scrollLeft;
  rail.setPointerCapture(e.pointerId);
});
rail.addEventListener("pointermove",e=>{
  if(!down)return;
  const dx=e.clientX-startX;
  if(Math.abs(dx)>4){rail.classList.add("dragging");moved=Math.abs(dx)}
  rail.scrollLeft=startL-dx;
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>
  rail.addEventListener(ev,()=>{down=false;rail.classList.remove("dragging")}));

render();
</script>
</body>
</html>
